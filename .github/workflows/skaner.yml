name: Poszukiwacz Steali

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: skaner
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  skan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalacja
        run: pip install requests pyyaml

      - name: Przywroc pamiec cen
        uses: actions/cache/restore@v4
        with:
          path: dane
          key: dane-${{ github.run_id }}
          restore-keys: dane-

      - name: Skanuj sklepy
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          MIEJSCE: github
        run: python skaner.py

      - name: Zapisz pamiec cen
        if: always()
        uses: actions/cache/save@v4
        with:
          path: dane
          key: dane-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Podtrzymanie
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 2592000 ]; then
            date > .ostatnio
            git config user.name "bot"
            git config user.email "bot@users.noreply.github.com"
            git add .ostatnio
            git commit -m "podtrzymanie"
            git push
          fi
